<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">D2 和田经莎车到喀什路线时间示意</title>
  <desc id="desc">07:00和田出发，G3012约320km到莎车约11:00；白天王陵+老城；20:00夜驱200km约22:30到喀什。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ead7"/>
      <stop offset="1" stop-color="#e9ddd0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#463629" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#bd6f35"/>
    </marker>
    <marker id="arrowNight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3d5a80"/>
    </marker>
  </defs>

  <rect width="1200" height="750" rx="36" fill="url(#bg)"/>
  <text x="60" y="68" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#292724">D2：和田 → 莎车 → 喀什（夜驱）</text>
  <text x="60" y="105" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#71685f">G3012主路 · 全天520km / 6.5h驾驶 · 白天4h + 夜驱2.5h</text>

  <!-- 白天段：和田→莎车 -->
  <line x1="195" y1="300" x2="560" y2="300" stroke="#bd6f35" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- 夜驱段：莎车→喀什 -->
  <line x1="680" y1="300" x2="1010" y2="300" stroke="#3d5a80" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 10" marker-end="url(#arrowNight)"/>

  <!-- 和田 -->
  <g filter="url(#shadow)">
    <circle cx="140" cy="300" r="50" fill="#7a4d2d"/>
    <text x="140" y="310" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fff">和田</text>
    <rect x="44" y="368" width="192" height="112" rx="18" fill="#fff"/>
    <text x="140" y="401" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2d2a26">07:00 出发</text>
    <text x="140" y="431" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8b8178">满油满电 · G3012</text>
    <text x="140" y="459" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8b8178">两人轮换驾驶</text>
  </g>

  <!-- 莎车 -->
  <g filter="url(#shadow)">
    <circle cx="620" cy="300" r="56" fill="#c8893f"/>
    <text x="620" y="310" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fff">莎车</text>
    <rect x="514" y="368" width="212" height="140" rx="18" fill="#fff"/>
    <text x="620" y="401" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2d2a26">约11:00 到</text>
    <text x="620" y="431" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#9b5e2c">320km · 4h</text>
    <text x="620" y="459" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8b8178">12:30 王陵 · 14:00 老城</text>
    <text x="620" y="487" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8b8178">19:00 晚饭+蓝调</text>
  </g>

  <!-- 喀什 -->
  <g filter="url(#shadow)">
    <circle cx="1060" cy="300" r="50" fill="#3d5a80"/>
    <text x="1060" y="310" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fff">喀什</text>
    <rect x="964" y="368" width="192" height="112" rx="18" fill="#fff"/>
    <text x="1060" y="401" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2d2a26">约22:30 到</text>
    <text x="1060" y="431" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3d5a80">200km · 2.5h 夜驱</text>
    <text x="1060" y="459" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8b8178">入住即睡 · D3凌05:00起</text>
  </g>

  <!-- 距离标注 -->
  <g filter="url(#shadow)">
    <rect x="280" y="195" width="200" height="62" rx="16" fill="#fff"/>
    <text x="380" y="224" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#9f4f1d">320km · 约4h</text>
    <text x="380" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#7c858b">G3012 白天</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="195" width="200" height="62" rx="16" fill="#fff"/>
    <text x="860" y="224" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3d5a80">200km · 约2.5h</text>
    <text x="860" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#7c858b">G3012 夜驱 20:00</text>
  </g>

  <!-- 底部说明 -->
  <g filter="url(#shadow)">
    <rect x="60" y="555" width="1080" height="128" rx="24" fill="#302d2a"/>
    <text x="92" y="595" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#fff">执行线</text>
    <text x="92" y="629" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e6ded6">莎车白天：王陵1h + 老城4h + 蓝调；20:00准时出发夜驱喀什，22:30到即睡</text>
    <text x="92" y="660" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#cabfb4">夜驱两人必须轮换，困倦立即进服务区。D3凌05:00出发木吉火山口，当晚睡眠约6h。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">D4 喀什经G314到塔县含红其拉甫国门路线时间示意</title>
  <desc id="desc">07:00喀什出发，经白沙湖、慕士塔格到塔县午餐，14:30南下红其拉甫国门，18:00折返，20:30回塔县。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e8"/>
      <stop offset="1" stop-color="#e8e0d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#3b3024" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8b5e3c"/>
    </marker>
    <marker id="arrowSouth" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a94732"/>
    </marker>
  </defs>

  <rect width="1200" height="750" rx="36" fill="url(#bg)"/>
  <text x="60" y="62" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#292724">D4：喀什 → 白沙湖 → 慕士塔格 → 塔县 → 红其拉甫</text>
  <text x="60" y="97" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#71685f">G314 + 中巴友谊公路 · 550km / 11h驾驶 · 最高海拔4733m · 住塔县1晚</text>

  <!-- 主线：喀什→塔县 -->
  <line x1="155" y1="250" x2="870" y2="250" stroke="#8b5e3c" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- 南下：塔县→红其拉甫 -->
  <line x1="930" y1="290" x2="930" y2="460" stroke="#a94732" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowSouth)"/>
  <!-- 返回：红其拉甫→塔县 -->
  <line x1="970" y1="460" x2="970" y2="290" stroke="#a94732" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 8" marker-end="url(#arrowSouth)"/>

  <!-- 喀什 -->
  <g filter="url(#shadow)">
    <circle cx="110" cy="250" r="44" fill="#3d5a80"/>
    <text x="110" y="258" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">喀什</text>
    <rect x="30" y="308" width="160" height="80" rx="14" fill="#fff"/>
    <text x="110" y="336" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#2d2a26">07:00 出发</text>
    <text x="110" y="362" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8b8178">1300m</text>
  </g>

  <!-- 白沙湖 -->
  <g filter="url(#shadow)">
    <circle cx="350" cy="250" r="38" fill="#4a90a4"/>
    <text x="350" y="245" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">白沙</text>
    <text x="350" y="264" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">湖</text>
    <rect x="280" y="308" width="140" height="72" rx="14" fill="#fff"/>
    <text x="350" y="336" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#2d2a26">~10:30</text>
    <text x="350" y="360" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b8178">短停15-20min</text>
  </g>

  <!-- 慕士塔格 -->
  <g filter="url(#shadow)">
    <circle cx="560" cy="250" r="42" fill="#5c7a3a"/>
    <text x="560" y="244" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">慕士</text>
    <text x="560" y="263" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">塔格</text>
    <rect x="487" y="308" width="146" height="72" rx="14" fill="#fff"/>
    <text x="560" y="336" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#2d2a26">~12:00</text>
    <text x="560" y="360" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b8178">短停20min · 3800m</text>
  </g>

  <!-- 塔县 -->
  <g filter="url(#shadow)">
    <circle cx="930" cy="250" r="46" fill="#7a4d2d"/>
    <text x="930" y="258" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">塔县</text>
    <rect x="1010" y="215" width="155" height="80" rx="14" fill="#fff"/>
    <text x="1088" y="243" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#2d2a26">~14:00 午餐</text>
    <text x="1088" y="267" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b8178">补能 · 3100m</text>
    <text x="1088" y="287" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b8178">20:30 回此住宿</text>
  </g>

  <!-- 红其拉甫 -->
  <g filter="url(#shadow)">
    <circle cx="950" cy="510" r="50" fill="#a94732"/>
    <text x="950" y="503" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">红其拉甫</text>
    <text x="950" y="524" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">国门</text>
    <rect x="830" y="575" width="240" height="90" rx="14" fill="#fff"/>
    <text x="950" y="603" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#a94732">~17:00 到 · 18:00 返</text>
    <text x="950" y="627" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8b8178">4733m · 停留从短</text>
    <text x="950" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8b8178">单程125km / 2.5h</text>
  </g>

  <!-- 底部 -->
  <g filter="url(#shadow)">
    <rect x="60" y="680" width="1080" height="52" rx="16" fill="#302d2a"/>
    <text x="92" y="712" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e6ded6">07:00喀什 → 10:30白沙湖 → 12:00慕士塔格 → 14:00塔县午餐 → 17:00国门 → 20:30回塔县 | 国门关闭则改村落+石头城</text>
  </g>
</svg>

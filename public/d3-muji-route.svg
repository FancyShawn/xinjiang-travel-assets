<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">D3 喀什往返木吉火山口路线时间示意</title>
  <desc id="desc">05:00喀什出发，约280km/4.5h到木吉火山口，玩1.5h后11:00折返，约15:30回喀什，16:00旅拍。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f8"/>
      <stop offset="1" stop-color="#dfe9f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#2c3e50" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5b7fa6"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c07830"/>
    </marker>
  </defs>

  <rect width="1200" height="750" rx="36" fill="url(#bg)"/>
  <text x="60" y="68" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#1e2a36">D3：喀什 ⇌ 木吉火山口 + 旅拍</text>
  <text x="60" y="105" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#5a6b7a">往返560km / 9h驾驶 · 含游览约14h · 本日极累</text>

  <!-- 去程线 -->
  <path d="M220 280 C380 200 580 200 740 280" fill="none" stroke="#5b7fa6" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- 返程线 -->
  <path d="M740 340 C580 420 380 420 220 340" fill="none" stroke="#c07830" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 9" marker-end="url(#arrowBack)"/>

  <!-- 喀什 -->
  <g filter="url(#shadow)">
    <circle cx="160" cy="310" r="52" fill="#3d5a80"/>
    <text x="160" y="320" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">喀什</text>
    <rect x="54" y="380" width="212" height="130" rx="18" fill="#fff"/>
    <text x="160" y="412" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#2d2a26">05:00 出发</text>
    <text x="160" y="440" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5b7fa6">海拔 1300m</text>
    <text x="160" y="466" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8b8178">约15:30 返回</text>
    <text x="160" y="492" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8b8178">16:00 旅拍/古城</text>
  </g>

  <!-- 木吉 -->
  <g filter="url(#shadow)">
    <circle cx="800" cy="310" r="58" fill="#6b4fa0"/>
    <text x="800" y="303" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">木吉</text>
    <text x="800" y="328" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">火山口</text>
    <rect x="694" y="380" width="212" height="130" rx="18" fill="#fff"/>
    <text x="800" y="412" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#2d2a26">约09:30 到</text>
    <text x="800" y="440" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#6b4fa0">海拔 3800m</text>
    <text x="800" y="466" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8b8178">火山口+十八罗汉峰</text>
    <text x="800" y="492" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#a94732">11:00 折返</text>
  </g>

  <!-- 距离标注 -->
  <g filter="url(#shadow)">
    <rect x="390" y="155" width="220" height="62" rx="16" fill="#fff"/>
    <text x="500" y="184" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#5b7fa6">280km · 约4.5h 去</text>
    <text x="500" y="207" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#7c858b">05:00→09:30</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="390" y="440" width="220" height="62" rx="16" fill="#fff"/>
    <text x="500" y="469" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#c07830">280km · 约4.5h 回</text>
    <text x="500" y="492" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#7c858b">11:00→15:30</text>
  </g>

  <!-- 天气闸门 -->
  <g filter="url(#shadow)">
    <rect x="900" y="180" width="240" height="80" rx="18" fill="#fff3e0"/>
    <text x="1020" y="212" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#e65100">⚠ 天气闸门</text>
    <text x="1020" y="238" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8b6914">低云/雨雪/强风 → 取消</text>
    <text x="1020" y="256" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8b6914">改为古城早拍+上午旅拍</text>
  </g>

  <!-- 底部 -->
  <g filter="url(#shadow)">
    <rect x="60" y="560" width="1080" height="128" rx="24" fill="#1e2a36"/>
    <text x="92" y="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#fff">执行线</text>
    <text x="92" y="634" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#dce6ee">05:00出发 → 09:30木吉(1.5h) → 11:00折返 → 15:30回喀什 → 16:00旅拍 → 蓝调</text>
    <text x="92" y="664" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#9ab0c4">睡眠约4.5h + 驾驶9h，两人必须轮换。边境通行证提前申请。骑马控制强度。</text>
  </g>
</svg>
